<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AREDL Chests</title>
<meta name="description" content="Open a chest, get a random extreme demon from the AREDL.">
<style>
  :root {
    --bg: #0c0a14;
    --panel: #171326;
    --panel2: #1f1a33;
    --text: #efeaff;
    --muted: #9a93b8;
    --glow: #ffb21a;
    --body: #8a5a2b;
    --band: #5b3a18;
    --trim: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #231a45 0%, var(--bg) 60%) fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header { text-align: center; padding: 28px 16px 8px; }
  h1 { margin: 0; font-size: clamp(26px, 5vw, 40px); letter-spacing: .5px; }
  h1 span { color: var(--glow); }
  .sub { color: var(--muted); margin-top: 6px; font-size: 14px; }
  #status { display: inline-block; margin-top: 10px; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--panel); color: var(--muted); }
  #status.ok { color: #6ee7a8; }
  #status.err { color: #ff8a8a; }

  main { max-width: 980px; margin: 0 auto; padding: 12px 16px 60px; }

  .tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 14px 0 6px; }
  .tier {
    background: var(--panel); border: 2px solid transparent; color: var(--text);
    border-radius: 12px; padding: 10px 8px; cursor: pointer; font: inherit; text-align: center;
    transition: transform .15s, border-color .15s, background .15s;
  }
  .tier:hover { transform: translateY(-2px); background: var(--panel2); }
  .tier.active { border-color: var(--tc); box-shadow: 0 0 18px -4px var(--tc); background: var(--panel2); }
  .tier b { display: block; font-size: 15px; color: var(--tc); }
  .tier small { color: var(--muted); font-size: 12px; }

  #custom {
    display: none; margin: 10px auto 0; max-width: 460px; background: var(--panel);
    border-radius: 12px; padding: 12px 14px; gap: 10px; align-items: center; justify-content: center;
    flex-wrap: wrap; font-size: 14px;
  }
  #custom.show { display: flex; }
  #custom input {
    width: 90px; background: #0e0b1a; border: 1px solid #3a3260; color: var(--text);
    border-radius: 8px; padding: 7px 8px; font: inherit; text-align: center;
  }
  #custom .hint { width: 100%; text-align: center; color: var(--muted); font-size: 12px; }
  #custom .hint.bad { color: #ff8a8a; }

  .stage { position: relative; height: 330px; display: flex; align-items: center; justify-content: center; margin-top: 6px; }
  .rays {
    position: absolute; width: 640px; height: 640px; left: 50%; top: 50%; margin: -320px 0 0 -320px;
    background: repeating-conic-gradient(from 0deg, var(--glow) 0deg 6deg, transparent 6deg 24deg);
    -webkit-mask: radial-gradient(circle, #000 0%, transparent 62%); mask: radial-gradient(circle, #000 0%, transparent 62%);
    opacity: 0; pointer-events: none; filter: blur(2px);
  }
  .stage.open .rays { animation: rays 2.4s ease-out forwards, spin 8s linear infinite; }
  @keyframes rays { 0% { opacity: 0; transform: scale(.4);} 20% { opacity: .55;} 100% { opacity: .18; transform: scale(1);} }
  @keyframes spin { to { rotate: 360deg; } }

  #chestWrap { position: relative; width: 250px; cursor: pointer; z-index: 2; transition: transform .2s; -webkit-tap-highlight-color: transparent; }
  #chestWrap:hover:not(.busy) { transform: scale(1.04); }
  #chestWrap.busy { cursor: default; }
  #chestWrap svg { width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 12px 18px rgba(0,0,0,.55)); }
  #chestWrap.idle svg { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  #chestWrap.shake svg { animation: shake .75s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%,90% { transform: translate(-2px,0) rotate(-1deg); } 20%,80% { transform: translate(4px,0) rotate(2deg); }
    30%,50%,70% { transform: translate(-7px,0) rotate(-3deg); } 40%,60% { transform: translate(7px,0) rotate(3deg); }
  }
  #lid { transform-box: view-box; transform-origin: 22px 82px; transition: transform .55s cubic-bezier(.2,1.4,.4,1); }
  #chestWrap.open #lid { transform: rotate(-42deg) translate(-2px,-4px); }
  #inside { opacity: 0; transition: opacity .3s; }
  #chestWrap.open #inside { opacity: 1; }
  .body-fill { fill: var(--body); } .band-fill { fill: var(--band); } .trim-fill { fill: var(--trim); }
  .hintText { position: absolute; left: 0; right: 0; bottom: -4px; text-align: center; color: var(--muted); font-size: 13px; pointer-events: none; }

  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  .actions { text-align: center; margin-top: 4px; }
  button.open {
    background: linear-gradient(180deg, var(--trim), var(--glow)); color: #1a1000; font-weight: 800; font-size: 17px;
    border: 0; padding: 12px 34px; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 20px -6px var(--glow);
    transition: transform .12s, filter .12s;
  }
  button.open:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
  button.open:disabled { opacity: .55; cursor: wait; }
  #poolInfo { margin-top: 8px; color: var(--muted); font-size: 13px; }

  #result { margin: 26px auto 0; max-width: 640px; display: none; }
  #result.show { display: block; animation: pop .6s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(30px) scale(.85) rotateX(25deg);} to { opacity: 1; transform: none; } }
  .card {
    background: var(--panel); border-radius: 16px; overflow: hidden; border: 2px solid var(--glow);
    box-shadow: 0 0 36px -8px var(--glow);
  }
  .thumb { position: relative; aspect-ratio: 16/9; background: #0a0814; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .noth { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
  .thumb.none .noth { display: flex; }
  .thumb.none img { display: none; }
  .badge {
    position: absolute; left: 12px; top: 12px; background: rgba(10,8,20,.85); color: var(--glow);
    font-weight: 800; font-size: 20px; padding: 5px 12px; border-radius: 10px; backdrop-filter: blur(4px);
  }
  .info { padding: 16px 18px 18px; }
  .info h2 { margin: 0 0 12px; font-size: 26px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .grid div { background: var(--panel2); border-radius: 10px; padding: 9px 12px; min-width: 0; }
  .grid label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .grid span { font-size: 16px; font-weight: 600; word-break: break-word; }
  .links { margin-top: 12px; }
  .links a { color: var(--glow); font-size: 14px; text-decoration: none; }
  .links a:hover { text-decoration: underline; }

  #recent { margin: 28px auto 0; max-width: 640px; }
  #recent h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin: 0 0 8px; }
  #recent ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #recent li { background: var(--panel); padding: 7px 12px; border-radius: 8px; font-size: 14px; display: flex; gap: 10px; }
  #recent li b { color: var(--glow); min-width: 46px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 30px; }
  footer a { color: var(--muted); }

  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .stage { height: 290px; } #chestWrap { width: 210px; } }
  [hidden] { display: none !important; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin: 6px 0 10px; }
  .tabs button { background: var(--panel); color: var(--text); border: 2px solid transparent; border-radius: 10px; padding: 8px 22px; font: inherit; font-weight: 700; cursor: pointer; }
  .tabs button.active { border-color: var(--glow); color: var(--glow); background: var(--panel2); }

  .xrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .xrow button, .mk button, button.sm, .filebtn {
    background: var(--panel2); color: var(--text); border: 1px solid #3a3260; border-radius: 8px;
    padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .xrow button:hover, .mk button:hover, button.sm:hover, .filebtn:hover { filter: brightness(1.2); }
  .xrow button[data-act="beaten"].on, .mk button[data-act="beaten"].on { background: #1c6b52; border-color: #38d39a; }
  .xrow button[data-act="skip"].on, .mk button[data-act="skip"].on { background: #6b1c2a; border-color: #ff5a6a; }
  button.warn { border-color: #ff5a6a; color: #ff9aa6; }

  .listbar, .bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; font-size: 14px; }
  .listbar input, .listbar select, .bulk input, .bulk select {
    background: #0e0b1a; border: 1px solid #3a3260; color: var(--text); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px;
  }
  .listbar input[type="search"] { flex: 1 1 240px; min-width: 0; }
  .bulk input[type="number"] { width: 84px; text-align: center; }
  .sum { color: var(--muted); font-size: 13px; margin: 8px 0; }

  .rows { display: grid; gap: 4px; }
  .row {
    display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    background: var(--panel); border-radius: 10px; padding: 8px 12px;
    content-visibility: auto; contain-intrinsic-size: auto 52px;
  }
  .row .pos { font-weight: 800; color: var(--glow); }
  .row .nm { min-width: 0; display: flex; flex-direction: column; }
  .row .nm b { overflow-wrap: anywhere; }
  .row .nm small { color: var(--muted); }
  .row .mk { display: flex; gap: 6px; }
  .row.x { opacity: .6; }
  .row.x .nm b { text-decoration: line-through; text-decoration-thickness: 2px; }
  .row.x .pos { color: var(--muted); }
  .row.x .pos::after { content: " ✕"; color: #ff5a6a; font-weight: 900; font-size: 18px; }
  .row.beaten .pos::after { content: " ✓"; color: #38d39a; }
  .empty { color: var(--muted); text-align: center; padding: 24px; }
  @media (max-width: 560px) { .row { grid-template-columns: 62px minmax(0, 1fr); } .row .mk { grid-column: 1 / -1; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<header>
  <h1>AREDL <span>Chests</span></h1>
  <div class="sub">Pick a chest, open it, and get a random extreme demon.</div>
  <div id="status">Loading list…</div>
</header>

<main>
  <nav class="tabs">
    <button data-view="chests" class="active">Chests</button>
    <button data-view="list">Level List</button>
  </nav>

  <div id="viewChests">
  <div class="tiers" id="tiers"></div>

  <div id="custom">
    <span>From #</span><input id="cMin" type="number" min="1" value="1">
    <span>to #</span><input id="cMax" type="number" min="1" value="100">
    <div class="hint" id="cHint"></div>
  </div>

  <div class="stage" id="stage">
    <div class="rays"></div>
    <div id="chestWrap" class="idle" title="Open chest">
      <svg viewBox="0 0 200 170" aria-label="Chest">
        <ellipse cx="100" cy="162" rx="84" ry="7" fill="rgba(0,0,0,.35)"/>
        <!-- body -->
        <rect class="body-fill" x="20" y="80" width="160" height="78" rx="7"/>
        <rect class="band-fill" x="20" y="80" width="160" height="12"/>
        <rect class="band-fill" x="46" y="80" width="14" height="78"/>
        <rect class="band-fill" x="140" y="80" width="14" height="78"/>
        <rect class="band-fill" x="20" y="144" width="160" height="14" rx="5"/>
        <g fill="rgba(255,255,255,.12)"><rect x="24" y="96" width="152" height="3" rx="1.5"/><rect x="24" y="116" width="152" height="3" rx="1.5"/></g>
        <!-- inside glow -->
        <g id="inside">
          <ellipse cx="100" cy="82" rx="74" ry="14" fill="var(--glow)"/>
          <ellipse cx="100" cy="82" rx="52" ry="8" fill="#fff" opacity=".85"/>
        </g>
        <!-- lid -->
        <g id="lid">
          <path class="body-fill" d="M20 82 V62 Q20 22 100 22 Q180 22 180 62 V82 Z"/>
          <path class="band-fill" d="M20 70 H180 V82 H20 Z"/>
          <path class="band-fill" d="M46 28 H60 V82 H46 Z" opacity=".9"/>
          <path class="band-fill" d="M140 28 H154 V82 H140 Z" opacity=".9"/>
          <path d="M26 58 Q30 32 100 28" stroke="rgba(255,255,255,.22)" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        <!-- lock -->
        <rect class="trim-fill" x="90" y="74" width="20" height="24" rx="4"/>
        <circle cx="100" cy="84" r="3.2" fill="#2a1a00"/><rect x="99" y="85" width="2" height="7" fill="#2a1a00"/>
        <g class="trim-fill"><rect x="20" y="80" width="6" height="78" opacity=".0"/></g>
      </svg>
      <div class="hintText" id="hint">Click the chest</div>
    </div>
  </div>

  <div class="actions">
    <button class="open" id="openBtn" disabled>Open chest</button>
    <div id="poolInfo"></div>
  </div>

  <section id="result"></section>
  <section id="recent" style="display:none"><h3>Recent pulls</h3><ol id="recentList"></ol></section>
  </div>

  <div id="viewList" hidden>
    <div class="listbar">
      <input id="lq" type="search" placeholder="Search name, #placement or level ID">
      <select id="lf">
        <option value="all">All levels</option>
        <option value="open">Still in chests</option>
        <option value="x">Crossed off</option>
        <option value="beaten">Beaten</option>
        <option value="skip">Don't want</option>
      </select>
    </div>
    <div class="bulk">
      <span>Mark #</span><input id="bFrom" type="number" min="1" value="1">
      <span>to #</span><input id="bTo" type="number" min="1" value="50">
      <select id="bKind">
        <option value="beaten">Beaten</option>
        <option value="skip">Don't want</option>
        <option value="none">Not crossed off</option>
      </select>
      <button class="sm" id="bApply">Apply</button><span id="bMsg" class="sum"></span>
    </div>
    <div class="bulk">
      <button class="sm" id="bExport">Export</button>
      <label class="filebtn">Import<input id="bImport" type="file" accept="application/json" hidden></label>
      <button class="sm warn" id="bClear">Clear all</button>
    </div>
    <div class="sum" id="lsum"></div>
    <div class="rows" id="rows"></div>
  </div>
</main>

<footer>
  Fan-made. Data from the <a href="https://aredl.net" target="_blank" rel="noopener">All Rated Extreme Demons List</a>, fetched live from its public API every time the page loads.
</footer>

<script>
(() => {
  "use strict";
  const API = "https://api.aredl.net/v2/api/aredl/levels";
  const CACHE_KEY = "aredl-chests-list-v1";

  const TIERS = [
    { id: "t50",   name: "Mythic",    label: "Top 50",   max: 50,   color: "#ff4df0", body: "#5a1b6b", band: "#2f0e3a", trim: "#ffb3f8" },
    { id: "t150",  name: "Legendary", label: "Top 150",  max: 150,  color: "#ffb21a", body: "#8a5a1b", band: "#4a2e0b", trim: "#ffe08a" },
    { id: "t300",  name: "Epic",      label: "Top 300",  max: 300,  color: "#a96bff", body: "#43307a", band: "#241a47", trim: "#d8c2ff" },
    { id: "t500",  name: "Rare",      label: "Top 500",  max: 500,  color: "#3aa0ff", body: "#1f4e86", band: "#102b4d", trim: "#a6d3ff" },
    { id: "t1000", name: "Uncommon",  label: "Top 1000", max: 1000, color: "#38d39a", body: "#1c6b52", band: "#0e3b2d", trim: "#a4f1d3" },
    { id: "all",   name: "Common",    label: "All levels", max: Infinity, color: "#d2b48c", body: "#7a5a3a", band: "#4a341f", trim: "#e9d5b3" },
    { id: "custom",name: "Custom",    label: "Custom range", max: null, color: "#e5e7eb", body: "#4b5563", band: "#1f2937", trim: "#f3f4f6" },
  ];

  const $ = (id) => document.getElementById(id);
  const el = { tiers: $("tiers"), custom: $("custom"), cMin: $("cMin"), cMax: $("cMax"), cHint: $("cHint"),
    stage: $("stage"), chest: $("chestWrap"), btn: $("openBtn"), pool: $("poolInfo"), result: $("result"),
    status: $("status"), hint: $("hint"), recent: $("recent"), recentList: $("recentList"), fx: $("fx") };

  let levels = [];           // [{position, name, level_id, id}] sorted by position
  let tier = TIERS[1];
  let busy = false;
  const recent = [];
  const MARK_KEY = "aredl-chests-crossed-v1";
  let marks = {};            // level_id -> "beaten" | "skip"
  try { marks = JSON.parse(localStorage.getItem(MARK_KEY) || "{}") || {}; } catch (_) { marks = {}; }
  const saveMarks = () => { try { localStorage.setItem(MARK_KEY, JSON.stringify(marks)); } catch (_) {} };

  /* ---------------- helpers ---------------- */
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const personName = (p) => {
    if (!p) return "Unknown";
    if (typeof p === "string") return p;
    return p.global_name || p.username || p.name || p.display_name || "Unknown";
  };
  function randInt(n) { // uniform 0..n-1
    const a = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n;
    do { crypto.getRandomValues(a); } while (a[0] >= lim);
    return a[0] % n;
  }
  function ytId(url) {
    if (!url) return null;
    const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/i);
    return m ? m[1] : null;
  }
  function setTheme(t) {
    const r = document.documentElement.style;
    r.setProperty("--glow", t.color); r.setProperty("--body", t.body);
    r.setProperty("--band", t.band); r.setProperty("--trim", t.trim);
  }

  /* ---------------- data ---------------- */
  function normalize(arr) {
    return arr
      .filter((l) => l && Number.isFinite(l.position) && l.position > 0)
      .map((l) => ({ id: l.id, position: l.position, name: l.name, level_id: l.level_id, raw: l }))
      .sort((a, b) => a.position - b.position);
  }
  function setStatus(text, cls) { el.status.textContent = text; el.status.className = cls || ""; }

  async function loadList() {
    // show cached list instantly, then always refresh from the API so new placements appear automatically
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (c && Array.isArray(c.data) && c.data.length) {
        levels = normalize(c.data); refreshUI();
        setStatus(`${levels.length} levels (cached, refreshing…)`);
      }
    } catch (_) {}
    try {
      const res = await fetch(API, { headers: { accept: "application/json" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const arr = Array.isArray(data) ? data : (data.data || data.levels || []);
      if (!arr.length) throw new Error("empty list");
      levels = normalize(arr);
      try {
        const slim = arr.map((l) => ({ id: l.id, position: l.position, name: l.name, level_id: l.level_id, publisher: l.publisher, verifications: l.verifications }));
        localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data: slim }));
      } catch (_) {}
      setStatus(`${levels.length} levels loaded live from AREDL`, "ok");
    } catch (e) {
      if (levels.length) setStatus(`Couldn't reach AREDL (${e.message}); using cached list of ${levels.length}`, "err");
      else setStatus(`Couldn't load the AREDL list (${e.message}). Check your connection and reload.`, "err");
    }
    refreshUI();
    if (view === "list") renderList();
  }

  async function fetchDetail(lv) {
    // the full list may omit verifier/video; the per-level endpoint has them
    try {
      const res = await fetch(`${API}/${encodeURIComponent(lv.id)}`, { headers: { accept: "application/json" } });
      if (!res.ok) return null;
      const d = await res.json();
      if (d && d.level_id != null && lv.level_id != null && d.level_id !== lv.level_id) return null; // wrong level guard
      return d;
    } catch (_) { return null; }
  }

  /* ---------------- pool ---------------- */
  function range() {
    const n = levels.length;
    if (tier.id === "custom") {
      let lo = parseInt(el.cMin.value, 10), hi = parseInt(el.cMax.value, 10);
      if (!Number.isFinite(lo) || !Number.isFinite(hi)) return { ok: false, msg: "Enter a start and end placement." };
      if (lo < 1 || hi < 1) return { ok: false, msg: "Placements start at 1." };
      if (lo > hi) return { ok: false, msg: "Start must be less than or equal to end." };
      if (lo > n) return { ok: false, msg: `The list only goes up to #${n} right now.` };
      return { ok: true, lo, hi: Math.min(hi, n), clamped: hi > n };
    }
    return { ok: true, lo: 1, hi: Math.min(tier.max, n) };
  }
  const inRange = (r) => (r.ok ? levels.filter((l) => l.position >= r.lo && l.position <= r.hi) : []);
  const pool = () => inRange(range()).filter((l) => !marks[l.level_id]);

  function refreshUI() {
    const r = range();
    el.cHint.className = "hint";
    if (tier.id === "custom") {
      el.cHint.textContent = !r.ok ? r.msg : (r.clamped ? `Clamped to the current end of the list (#${levels.length}).` : `Range #${r.lo} – #${r.hi}`);
      if (!r.ok) el.cHint.className = "hint bad";
    }
    const base = inRange(r), p = base.filter((l) => !marks[l.level_id]).length, x = base.length - p;
    el.pool.textContent = levels.length && r.ok ? `${p} level${p === 1 ? "" : "s"} in this chest` + (x ? ` (${x} crossed off)` : "") : "";
    el.btn.disabled = busy || p === 0;
    el.hint.textContent = p ? "Click the chest" : (!levels.length ? "Loading…" : (base.length ? "Everything here is crossed off" : "Invalid range"));
  }

  /* ---------------- tiers ---------------- */
  function buildTiers() {
    el.tiers.innerHTML = "";
    TIERS.forEach((t) => {
      const b = document.createElement("button");
      b.className = "tier"; b.style.setProperty("--tc", t.color);
      b.innerHTML = `<b>${esc(t.name)}</b><small>${esc(t.label)}</small>`;
      b.addEventListener("click", () => { if (busy) return; selectTier(t); });
      b.dataset.id = t.id; el.tiers.appendChild(b);
    });
  }
  function selectTier(t) {
    tier = t; setTheme(t);
    [...el.tiers.children].forEach((c) => c.classList.toggle("active", c.dataset.id === t.id));
    el.custom.classList.toggle("show", t.id === "custom");
    resetChest(); refreshUI();
  }
  function resetChest() {
    el.chest.classList.remove("open", "shake", "busy"); el.chest.classList.add("idle");
    el.stage.classList.remove("open"); el.result.classList.remove("show");
  }

  /* ---------------- effects ---------------- */
  const ctx = el.fx.getContext("2d");
  let parts = [], raf = null;
  function sizeCanvas() { const d = window.devicePixelRatio || 1; el.fx.width = innerWidth * d; el.fx.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener("resize", sizeCanvas); sizeCanvas();
  function burst() {
    const r = el.chest.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height * 0.4;
    const cols = [tier.color, tier.trim, "#ffffff"];
    for (let i = 0; i < 130; i++) {
      const a = (-Math.PI / 2) + (Math.random() - .5) * 2.4, v = 4 + Math.random() * 11;
      parts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .22 + Math.random() * .1,
        s: 3 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
        c: cols[randInt(cols.length)], life: 1, star: Math.random() < .35 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
    for (const p of parts) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .985; p.rot += p.vr; p.life -= .008;
      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 8;
      if (p.star) { ctx.beginPath(); for (let k = 0; k < 4; k++) { ctx.lineTo(0, -p.s * 1.6); ctx.rotate(Math.PI / 4); ctx.lineTo(0, -p.s * .5); ctx.rotate(Math.PI / 4); } ctx.fill(); }
      else ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : (ctx.clearRect(0, 0, innerWidth, innerHeight), null);
  }

  /* ---------------- open ---------------- */
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function openChest() {
    if (busy) return;
    const p = pool(); if (!p.length) return;
    busy = true; el.btn.disabled = true;
    el.result.classList.remove("show");
    el.stage.classList.remove("open"); el.chest.classList.remove("open", "idle"); el.chest.classList.add("busy");
    el.hint.textContent = "";

    const pick = p[randInt(p.length)];
    const detailP = fetchDetail(pick);

    el.chest.classList.add("shake"); await sleep(800);
    el.chest.classList.remove("shake");
    el.chest.classList.add("open"); el.stage.classList.add("open");
    burst(); await sleep(250); burst();

    const detail = await detailP;
    await sleep(500);
    showResult(pick, detail);
    recent.unshift(pick); recent.length = Math.min(recent.length, 8); renderRecent();

    busy = false; el.btn.textContent = "Open another"; refreshUI();
    el.chest.classList.remove("busy");
  }

  function showResult(lv, d) {
    const src = d || lv.raw || {};
    const ver = (Array.isArray(src.verifications) && src.verifications[0]) || (lv.raw.verifications && lv.raw.verifications[0]) || null;
    const video = (ver && (ver.video_url || ver.videoUrl)) || src.video_url || null;
    const verifier = ver ? personName(ver.submitted_by || ver.verifier || ver.user || ver.player) : "Unknown";
    const publisher = personName(src.publisher || lv.raw.publisher);
    const yt = ytId(video);
    const thumb = yt ? `https://i.ytimg.com/vi/${yt}/maxresdefault.jpg` : "";
    el.result.innerHTML = `
      <div class="card">
        <div class="thumb ${yt ? "" : "none"}">
          ${yt ? `<img alt="Thumbnail of ${esc(lv.name)}" src="${thumb}">` : ""}
          <div class="noth">No video thumbnail available</div>
          <div class="badge">#${lv.position}</div>
        </div>
        <div class="info">
          <h2>${esc(lv.name)}</h2>
          <div class="grid">
            <div><label>Placement</label><span>#${lv.position}</span></div>
            <div><label>Level ID</label><span>${esc(lv.level_id)}</span></div>
            <div><label>Verifier</label><span>${esc(verifier)}</span></div>
            <div><label>Publisher</label><span>${esc(publisher)}</span></div>
          </div>
          ${video ? `<div class="links"><a href="${esc(video)}" target="_blank" rel="noopener">Watch the verification ↗</a></div>` : ""}
          <div class="xrow">
            <button data-act="beaten">✓ I beat this</button>
            <button data-act="skip">✕ Don't want it</button>
          </div>
        </div>
      </div>`;
    current = lv; syncResultButtons();
    el.result.querySelectorAll(".xrow button").forEach((b) => b.addEventListener("click", () => setMark(lv, b.dataset.act)));
    const img = el.result.querySelector("img");
    if (img) img.addEventListener("error", function once() {
      img.removeEventListener("error", once);
      img.addEventListener("error", () => img.closest(".thumb").classList.add("none"), { once: true });
      img.src = `https://i.ytimg.com/vi/${yt}/hqdefault.jpg`;
    });
    // maxres returns a 120px placeholder instead of an error when missing
    if (img) img.addEventListener("load", () => { if (img.naturalWidth <= 120 && img.src.includes("maxresdefault")) img.src = `https://i.ytimg.com/vi/${yt}/hqdefault.jpg`; });
    el.result.classList.remove("show"); void el.result.offsetWidth; el.result.classList.add("show");
    el.result.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function renderRecent() {
    el.recent.style.display = recent.length ? "block" : "none";
    el.recentList.innerHTML = recent.map((l) => `<li><b>#${l.position}</b><span>${esc(l.name)}</span></li>`).join("");
  }

  /* ---------------- crossed-off levels + level list ---------------- */
  let current = null, view = "chests";
  const list = { box: $("rows"), q: $("lq"), f: $("lf"), sum: $("lsum") };

  function setMark(lv, kind) {
    const k = lv.level_id;
    if (marks[k] === kind) delete marks[k]; else marks[k] = kind;
    saveMarks(); refreshUI(); syncResultButtons(); updateRow(k); updateSummary();
  }
  function syncResultButtons() {
    if (!current) return;
    const m = marks[current.level_id];
    el.result.querySelectorAll(".xrow button").forEach((b) => b.classList.toggle("on", m === b.dataset.act));
  }
  function rowHTML(l) {
    const m = marks[l.level_id];
    return `<div class="row${m ? " x " + m : ""}" data-id="${esc(l.level_id)}">
      <span class="pos">#${l.position}</span>
      <div class="nm"><b>${esc(l.name)}</b><small>ID ${esc(l.level_id)}</small></div>
      <div class="mk"><button data-act="beaten" class="${m === "beaten" ? "on" : ""}">✓ Beaten</button><button data-act="skip" class="${m === "skip" ? "on" : ""}">✕ Don't want</button></div>
    </div>`;
  }
  function filtered() {
    const q = list.q.value.trim().toLowerCase().replace(/^#/, ""), f = list.f.value;
    return levels.filter((l) => {
      const m = marks[l.level_id];
      if (f === "open" && m) return false;
      if (f === "x" && !m) return false;
      if ((f === "beaten" || f === "skip") && m !== f) return false;
      if (!q) return true;
      return String(l.name || "").toLowerCase().includes(q) || String(l.position) === q || String(l.level_id).includes(q);
    });
  }
  function updateSummary() {
    let b = 0, s = 0;
    for (const l of levels) { const m = marks[l.level_id]; if (m === "beaten") b++; else if (m === "skip") s++; }
    list.sum.textContent = levels.length
      ? `${levels.length} levels · ${b} beaten · ${s} don't want · ${levels.length - b - s} still in the chests. Saved in this browser.`
      : "Loading levels…";
  }
  function renderList() {
    const rows = filtered();
    list.box.innerHTML = rows.length ? rows.map(rowHTML).join("") : `<p class="empty">${levels.length ? "No levels match." : "Loading levels…"}</p>`;
    updateSummary();
  }
  function updateRow(k) {
    if (view !== "list") return;
    const row = list.box.querySelector(`[data-id="${CSS.escape(String(k))}"]`);
    const lv = levels.find((l) => String(l.level_id) === String(k));
    if (row && lv) row.outerHTML = rowHTML(lv);
  }
  function showView(v) {
    view = v;
    $("viewChests").hidden = v !== "chests"; $("viewList").hidden = v !== "list";
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.view === v));
    if (v === "list") renderList(); else refreshUI();
  }
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => showView(b.dataset.view)));
  list.q.addEventListener("input", renderList);
  list.f.addEventListener("change", renderList);
  list.box.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const id = b.closest(".row").dataset.id;
    const lv = levels.find((l) => String(l.level_id) === id);
    if (lv) setMark(lv, b.dataset.act);
  });
  $("bApply").addEventListener("click", () => {
    const lo = parseInt($("bFrom").value, 10), hi = parseInt($("bTo").value, 10), kind = $("bKind").value, msg = $("bMsg");
    if (!(lo >= 1) || !(hi >= lo)) { msg.textContent = "Enter a valid range."; return; }
    let n = 0;
    for (const l of levels) if (l.position >= lo && l.position <= hi) { if (kind === "none") delete marks[l.level_id]; else marks[l.level_id] = kind; n++; }
    saveMarks(); refreshUI(); renderList(); syncResultButtons();
    msg.textContent = `${n} level${n === 1 ? "" : "s"} updated.`;
  });
  $("bClear").addEventListener("click", () => {
    if (!Object.keys(marks).length) return;
    if (!confirm("Remove every X and checkmark?")) return;
    marks = {}; saveMarks(); refreshUI(); renderList(); syncResultButtons();
  });
  $("bExport").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(marks, null, 1)], { type: "application/json" }));
    a.download = "aredl-chests-crossed-off.json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $("bImport").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try {
      const data = JSON.parse(await f.text()); let n = 0;
      for (const [k, v] of Object.entries(data || {})) if (v === "beaten" || v === "skip") { marks[k] = v; n++; }
      saveMarks(); refreshUI(); renderList(); syncResultButtons();
      $("bMsg").textContent = `Imported ${n} level${n === 1 ? "" : "s"}.`;
    } catch (_) { $("bMsg").textContent = "That file isn't a valid export."; }
  });

  /* ---------------- wire up ---------------- */
  buildTiers();
  selectTier(TIERS[1]);
  el.chest.addEventListener("click", openChest);
  el.btn.addEventListener("click", openChest);
  el.cMin.addEventListener("input", refreshUI);
  el.cMax.addEventListener("input", refreshUI);
  loadList();
})();
</script>
</body>
</html>
